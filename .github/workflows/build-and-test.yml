name: Build and Test

on: pull_request

jobs:
  build-and-test:
    name:Build and Test (${{ matrix.leg }})
    strategy:
      # The matrix exists to say whether a failure is specific to one platform or configuration; cancelling
      # the other legs on the first failure would throw that answer away.
      fail-fast: false
      matrix:
        include:
          - leg: windows
            runner: windows-latest
          - leg: linux-x64
            runner: ubuntu-latest
          - leg: linux-arm64
            runner: ubuntu-24.04-arm
          # tr-TR breaks culture-sensitive case mapping (i -> İ) and uses a decimal comma; St. John's is a
          # half-hour offset with DST. Each targets a claim the suite makes about not depending on the host.
          - leg: linux-x64-host-config
            runner: ubuntu-latest
            locale: tr_TR.UTF-8
            culture: tr-TR
            timezone: America/St_Johns
    runs-on: ${{ matrix.runner }}
    # A backstop for hangs outside the test host (restore, build). The slowest green leg (windows) takes under two minutes.
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
    - uses: actions/checkout@v4
    # Written to GITHUB_ENV rather than the job's env: an expression that is empty on the other legs would
    # still set LANG/TZ to the empty string there instead of leaving the runner defaults alone.
    - name: Configure host locale and timezone
      if: matrix.locale
      run: |
        sudo locale-gen ${{ matrix.locale }}
        {
          echo "LANG=${{ matrix.locale }}"
          echo "LC_ALL=${{ matrix.locale }}"
          echo "TZ=${{ matrix.timezone }}"
          echo "LUARENAMER_EXPECT_CULTURE=${{ matrix.culture }}"
          echo "LUARENAMER_EXPECT_TZ=${{ matrix.timezone }}"
        } >> "$GITHUB_ENV"
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: '**/packages.lock.json'
    - name: Restore
      run: dotnet restore --locked-mode
    - name: Build
      run: dotnet build --no-restore
    # The build's GenerateLuaDefs target rewrites the tracked lua defs from the LuaEnv models, so a dirty
    # tree here means the committed defs.lua/enums.lua/env.lua are stale.
    - name: Verify generated Lua defs are current
      run: git diff --exit-code -- LuaRenamer/lua/
    # The suite runs in seconds, so a test host still running after 5 minutes is hung. HangDump then writes a
    # process dump and the tests in flight to TestResults and fails the run.
    - name: Test
      run: dotnet test --no-restore --no-build --verbosity normal --hangdump --hangdump-timeout 5m
    - name: Upload hang dumps and test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        # Artifact names are unique per run, so legs that fail together would collide on a shared one.
        name: test-results-${{ matrix.leg }}
        path: TestResults/**
        retention-days: 7
