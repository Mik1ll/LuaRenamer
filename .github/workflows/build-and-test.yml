name: Build and Test

on: pull_request

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A backstop for hangs outside the test host (restore, build). A green run takes under a minute.
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: '**/packages.lock.json'
    - name: Restore
      run: dotnet restore --locked-mode
    - name: Build
      run: dotnet build --no-restore
    # The build's GenerateLuaDefs target rewrites the tracked lua defs from the LuaEnv models, so a dirty
    # tree here means the committed defs.lua/enums.lua/env.lua are stale.
    - name: Verify generated Lua defs are current
      run: git diff --exit-code -- LuaRenamer/lua/
    # The suite runs in seconds, so a test host still running after 5 minutes is hung. HangDump then writes a
    # process dump and the tests in flight to TestResults and fails the run.
    - name: Test
      run: dotnet test --no-restore --no-build --verbosity normal --hangdump --hangdump-timeout 5m
    - name: Upload hang dumps and test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults/**
        retention-days: 7
