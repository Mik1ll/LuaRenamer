name: Publish Release
run-name: Publish ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (v1.2.3 for Stable, v1.2.3.4 for a prerelease); created at the released commit if it does not exist
        required: true
        type: string
      commit-ish:
        description: Branch, tag or full SHA to release; defaults to the workflow ref
        required: false
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        type: boolean
        default: true

env:
  TAG: ${{ inputs.tag }}
  CHANNEL: ${{ inputs.prerelease && 'Dev' || 'Stable' }}

jobs:
  publish-release:
    runs-on: ubuntu-latest
    # The manifest is read before the build and pushed after the release, so runs must not overlap.
    concurrency:
      group: update-manifest
      cancel-in-progress: false
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.commit-ish }}
        fetch-depth: 1
    - uses: actions/checkout@v4
      with:
        ref: manifest
        path: manifest-branch
    - name: Check version
      # shoko-build matches releases by version alone, so reusing a version would overwrite that release.
      # The server reads a revision as Dev, so the revision has to agree with the channel.
      run: |
        VERSION="${TAG#v}"; VERSION="${VERSION%%-*}"
        [[ "$CHANNEL" == Dev ]] && PATTERN='^[0-9]+(\.[0-9]+){2}\.[1-9][0-9]*$' || PATTERN='^[0-9]+(\.[0-9]+){2}$'
        [[ "$VERSION" =~ $PATTERN ]] || { echo "::error::$VERSION does not fit $CHANNEL: prerelease tags need a revision (v1.2.3.4), Stable tags must not have one (v1.2.3)"; exit 1; }
        jq -e --arg version "$VERSION" 'any(.releases[]; .version == $version) | not' manifest-branch/manifest.json > /dev/null \
          || { echo "::error::$VERSION is already in the manifest"; exit 1; }
    - name: Tag HEAD
      # shoko-build reads the release tag from `git describe --exact-match` and silently falls back to the
      # project version when HEAD is untagged, so an existing tag has to be checked against HEAD here.
      run: |
        git fetch --depth=1 origin "+refs/tags/$TAG:refs/tags/$TAG" || git tag "$TAG"
        [[ "$(git rev-parse "$TAG^{commit}")" == "$(git rev-parse HEAD)" ]] || { echo "::error::$TAG is not on HEAD"; exit 1; }
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: '**/packages.lock.json'
    - name: Restore
      run: dotnet restore --locked-mode
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-restore --no-build --verbosity normal
    - name: Restore tools
      run: dotnet tool restore
    - name: Generate release notes
      env:
        GH_TOKEN: ${{ github.token }}
      run: >-
        gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes"
        -f tag_name="$TAG"
        -f target_commitish="$(git rev-parse HEAD)"
        --jq .body
        > "$RUNNER_TEMP/release-notes.md"
    - name: Package
      # Reuses the locked restore above; RuntimeIdentifiers in LuaRenamer.csproj puts every RID in it.
      # A per-RID restore would push the RID onto LuaEnv and DefsGenerator, whose lock files have none.
      run: >-
        dotnet shoko-build ./LuaRenamer/LuaRenamer.csproj
        -c Release
        --no-restore
        -p:ReleaseChannel="$CHANNEL"
        --manifest ./manifest-branch/manifest.json
        --release-notes-path "$RUNNER_TEMP/release-notes.md"
        --output './publish/LuaRenamer_{tag}_{runtime}.zip'
        --url 'https://github.com/${{ github.repository }}/releases/download/{tag}/LuaRenamer_{tag}_{runtime}.zip'
    - uses: actions/create-github-app-token@v2
      id: app-token
      with:
        app-id: ${{ vars.RELEASE_APP_ID }}
        private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    - name: Release
      env:
        # The v* tag ruleset only lets admins and the release app create tags; GITHUB_TOKEN cannot bypass it.
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: >-
        gh release create "$TAG" ./publish/*.zip
        --target "$(git rev-parse HEAD)"
        --notes-file "$RUNNER_TEMP/release-notes.md"
        --prerelease="$PRERELEASE"
    - name: Push manifest
      # shoko-build records no source revision.
      run: |
        jq --arg tag "$TAG" --arg revision "$(git rev-parse HEAD)" '
          (.releases[] | select(.tag == $tag)).source_revision = $revision
        ' manifest-branch/manifest.json > manifest.json.tmp
        mv manifest.json.tmp manifest-branch/manifest.json

        cd manifest-branch
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add manifest.json
        git commit -m "ci: update manifest for ${TAG} (${CHANNEL})"
        git push origin HEAD:manifest
