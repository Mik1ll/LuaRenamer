name: Publish Release

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+**

jobs:
  publish-release:
    runs-on: ubuntu-latest
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        cache: true
        cache-dependency-path: '**/packages.lock.json'
    - name: Restore
      run: dotnet restore --locked-mode
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-restore --no-build --verbosity normal
    - name: Install Shoko BuildTools
      run: dotnet tool install Shoko.BuildTools --tool-path ./.tools --version 0.4.0
    - name: Package
      # The portable locked restore above validates dependencies. The plugin archives
      # need a fresh assets file and isolated temporary lockfile for each runtime identifier.
      run: >-
        ./.tools/shoko-build ./LuaRenamer/LuaRenamer.csproj
        -c Release
        -p:RestoreLockedMode=false
        -p:NuGetLockFilePath=obj/Shoko.BuildTools/packages.lock.json
        --output './publish/LuaRenamer_{tag}_{runtime}.zip'
        --url 'https://github.com/${{ github.repository }}/releases/download/{tag}/LuaRenamer_{tag}_{runtime}.zip'
    - name: Release
      env:
        GH_TOKEN: ${{ secrets.MY_GITHUB_RELEASE_PAT }}
      run: gh release create "$GITHUB_REF_NAME" ./publish/*.zip --generate-notes --verify-tag --prerelease
