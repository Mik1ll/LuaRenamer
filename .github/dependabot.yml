version: 2
updates:
  - package-ecosystem: nuget
    # Singular "directory", not "directories". Discovery expands LuaRenamer.slnx from here and
    # reaches every project either way, but the plural key opts into the multi-directory machinery:
    # refreshes then run once per directory in a shared checkout, and the second directory sees the
    # first one's edit, decides the bump already happened, and closes the PR it just pushed.
    directory: "/"
    schedule:
      interval: "weekly"
